<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Multijoueur P2P Auto-Host</title>
    <!-- Importation de PeerJS depuis un CDN gratuit -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            transition: background-color 0.3s, color 0.3s;
            background-color: #111;
            color: #fff;
        }
        /* Thème blanc */
        body.light {
            background-color: #ffffff;
            color: #111111;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid currentColor;
            background: transparent;
            color: inherit;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
            text-align: center;
        }
        /* Style de la popup d'autorisation */
        #modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .modal-box {
            background: #222;
            color: #fff;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <!-- Popup de consentement -->
    <div id="modal">
        <div class="modal-box">
            <h2>Rejoindre la session P2P ?</h2>
            <p>Votre navigateur va se connecter aux autres visiteurs en Peer-to-Peer.</p>
            <button id="btn-accept">Autoriser et rejoindre</button>
        </div>
    </div>

    <!-- Interface principale -->
    <button id="btn-toggle" disabled>Changer la couleur (Noir / Blanc)</button>
    <div id="status">En attente d'autorisation...</div>

    <script>
        // Identifiant fixe unique pour votre site (changez-le pour éviter les collisions avec d'autres tests)
        const HOST_ID = "mon-super-site-p2p-salon-unique-98765";

        let peer = null;
        let isHost = false;
        let hostConn = null;          // Si client : connexion vers l'hôte
        let clientConns = [];         // Si hôte : liste des connexions clients
        let peerList = [];            // Liste ordonnée des IDs connectés
        let isLight = false;          // État actuel de la page (false = noir, true = blanc)

        const statusEl = document.getElementById('status');
        const btnToggle = document.getElementById('btn-toggle');
        const modal = document.getElementById('modal');

        // 1. Démarrage après clic sur la popup
        document.getElementById('btn-accept').addEventListener('click', () => {
            modal.style.display = 'none';
            initNetwork();
        });

        // 2. Tentative de connexion (Hôte par défaut, sinon Client)
        function initNetwork() {
            updateStatus("Recherche d'un hôte existant...");
            if (peer) peer.destroy();

            // On essaie de prendre l'ID de l'hôte
            peer = new Peer(HOST_ID);

            peer.on('open', (id) => {
                // Succès : personne n'avait cet ID, nous sommes l'HÔTE
                isHost = true;
                peerList = [id];
                btnToggle.disabled = false;
                updateStatus(`Vous êtes l'HÔTE (Joueurs : 1)`);
                setupHostListeners();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // L'ID est déjà pris : un hôte existe ! On devient CLIENT
                    isHost = false;
                    becomeClient();
                } else {
                    updateStatus("Erreur réseau : " + err.type);
                }
            });
        }

        // 3. Logique de l'HÔTE
        function setupHostListeners() {
            peer.on('connection', (conn) => {
                conn.on('open', () => {
                    clientConns.push(conn);
                    peerList.push(conn.peer);
                    broadcastState(); // Envoie l'état actuel et la liste des joueurs à tout le monde
                    updateStatus(`Vous êtes l'HÔTE (Joueurs : ${peerList.length})`);
                });

                conn.on('data', (data) => {
                    if (data.type === 'TOGGLE') {
                        isLight = !isLight;
                        applyColor();
                        broadcastState();
                    }
                });

                conn.on('close', () => {
                    clientConns = clientConns.filter(c => c.peer !== conn.peer);
                    peerList = peerList.filter(id => id !== conn.peer);
                    broadcastState();
                    updateStatus(`Vous êtes l'HÔTE (Joueurs : ${peerList.length})`);
                });
            });
        }

        // L'hôte diffuse l'état à tous les clients
        function broadcastState() {
            const payload = {
                type: 'SYNC',
                isLight: isLight,
                peerList: peerList
            };
            clientConns.forEach(conn => {
                if (conn.open) conn.send(payload);
            });
        }

        // 4. Logique du CLIENT
        function becomeClient() {
            if (peer) peer.destroy();
            peer = new Peer(); // Génère un ID aléatoire pour le client

            peer.on('open', (myId) => {
                updateStatus("Hôte trouvé, connexion en cours...");
                hostConn = peer.connect(HOST_ID);

                hostConn.on('open', () => {
                    btnToggle.disabled = false;
                    updateStatus("Connecté en tant que CLIENT");
                });

                hostConn.on('data', (data) => {
                    if (data.type === 'SYNC') {
                        isLight = data.isLight;
                        peerList = data.peerList;
                        applyColor();
                        updateStatus(`Connecté en tant que CLIENT (Joueurs : ${peerList.length})`);
                    }
                });

                // 5. Gestion de la déconnexion de l'hôte (Transfert d'hébergement)
                hostConn.on('close', () => {
                    btnToggle.disabled = true;
                    handleHostMigration(myId);
                });
            });
        }

        // 6. Élection et transfert du nouvel hôte
        function handleHostMigration(myId) {
            updateStatus("L'hôte est parti ! Transfert de l'hébergement...");
            // On retire l'ancien hôte (index 0) de la liste
            const remainingPeers = peerList.filter(id => id !== HOST_ID);

            if (remainingPeers[0] === myId) {
                // Je suis le suivant sur la liste : je prends le relais après 1.5s
                setTimeout(() => {
                    initNetwork();
                }, 1500);
            } else {
                // J'attends 3s que le nouvel hôte s'installe, puis je me reconnecte
                setTimeout(() => {
                    becomeClient();
                }, 3000);
            }
        }

        // Action du bouton
        btnToggle.addEventListener('click', () => {
            if (isHost) {
                isLight = !isLight;
                applyColor();
                broadcastState();
            } else if (hostConn && hostConn.open) {
                hostConn.send({ type: 'TOGGLE' });
            }
        });

        // Mise à jour visuelle
        function applyColor() {
            document.body.classList.toggle('light', isLight);
        }

        function updateStatus(msg) {
            statusEl.textContent = msg;
        }

        // Libère proprement l'ID sur le serveur PeerJS quand l'utilisateur ferme l'onglet
        window.addEventListener('beforeunload', () => {
            if (peer) peer.destroy();
        });
    </script>
</body>
</html>
